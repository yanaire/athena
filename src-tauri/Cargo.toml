[package]
name = "athena-desktop"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
# Windows codegen uses the application icon resource API in the matching Tauri release.
tauri-codegen = "=2.7.6"
tauri-plugin = "=2.7.4"

[dependencies]
anyhow = "1"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.7", features = [] }
tauri-macros = "=2.7.6"
tauri-runtime = "=2.12.4"
tauri-runtime-wry = "=2.12.5"
tauri-utils = "=2.10.4"
tauri-plugin-dialog = "=2.7.3"
# Keep the dialog and filesystem plugins pinned to the tested pair.
tauri-plugin-fs = { version = "=2.7.1", default-features = false }
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
