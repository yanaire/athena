name: Recover generated UI blobs

on:
  push:
    branches:
      - integration/athena-generated-ui-recovery

permissions:
  contents: read

jobs:
  generate-blobs:
    if: github.repository == 'yanaire/athena-1' && github.ref == 'refs/heads/integration/athena-generated-ui-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the three fixed source revisions
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          targets = [
              ("ui", "c06a302840c85812e3bf2fa422618821564dfe3b", "0579af1a5bfaa57eb67c2372b34602ebaaf09db9"),
              ("baseline", "71d46a2c34aad1035395f93b88942a0bf890ce67", None),
              ("integration", "5c4adc9b4ad3224259e311b12b0aaab26da47a09", None),
          ]
          relative = "athena-backend-handoff/athena-codex-ui/athena-preview.html"
          records = []
          for label, source, expected in targets:
              root = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("athena-generated-" + label)
              subprocess.run(["git", "worktree", "add", "--detach", str(root), source], check=True)
              actual = subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
              if actual != source:
                  raise RuntimeError("Unexpected source revision")
              subprocess.run(["python3", str(root / "athena-backend-handoff/athena-codex-ui/build.py")], check=True)
              changed = subprocess.check_output(["git", "-C", str(root), "diff", "--name-only"], text=True).splitlines()
              if changed != [relative]:
                  raise RuntimeError("Generation changed an unexpected file")
              output = root / relative
              payload = output.read_bytes()
              if not 0 < len(payload) < 5 * 1024 * 1024:
                  raise RuntimeError("Unexpected generated HTML size")
              sha = hashlib.sha1(b"blob " + str(len(payload)).encode("ascii") + b"\0" + payload).hexdigest()
              if expected is not None and sha != expected:
                  raise RuntimeError("Generated UI differs from the independently reconstructed bytes")
              records.append({"label": label, "source": source, "path": str(output), "sha": sha, "size": len(payload)})
              print("GENERATED", label, source, sha, len(payload), flush=True)
          manifest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "athena-generated-manifest.json"
          manifest.write_text(json.dumps(records), encoding="utf-8")
          PY
      - name: Store immutable blobs without moving any ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          expected_sources = {
              "ui": "c06a302840c85812e3bf2fa422618821564dfe3b",
              "baseline": "71d46a2c34aad1035395f93b88942a0bf890ce67",
              "integration": "5c4adc9b4ad3224259e311b12b0aaab26da47a09",
          }
          manifest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "athena-generated-manifest.json"
          records = json.loads(manifest.read_text(encoding="utf-8"))
          if {row["label"]: row["source"] for row in records} != expected_sources or len(records) != 3:
              raise RuntimeError("Unexpected generated source manifest")
          for row in records:
              payload = pathlib.Path(row["path"]).read_bytes()
              sha = hashlib.sha1(b"blob " + str(len(payload)).encode("ascii") + b"\0" + payload).hexdigest()
              if sha != row["sha"] or len(payload) != row["size"]:
                  raise RuntimeError("Generated bytes changed before upload")
              request = urllib.request.Request(
                  "https://api.github.com/repos/yanaire/athena-1/git/blobs",
                  data=json.dumps({"encoding": "base64", "content": base64.b64encode(payload).decode("ascii")}).encode("utf-8"),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              if result.get("sha") != sha:
                  raise RuntimeError("GitHub stored a different blob")
              print("SAVED_BLOB", row["label"], row["source"], sha, row["size"], flush=True)
          PY
