name: Verify Windows atomic private storage
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: windows-helper-probe-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-storage:
    name: storage-${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the fixed Windows permission helper
        run: npm run windows:prepare
      - name: Verify atomic owner and lock publication
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-concurrency=1 tests/private-storage.test.ts tests/local-credentials.test.ts tests/credential-binding.test.ts
      - name: Verify private roots and complete recovery cleanup
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-concurrency=1 --test-timeout=180000 tests/connections.test.ts tests/storage.test.ts tests/model-profiles.test.ts tests/extensions.test.ts tests/manager-recovery.test.ts
