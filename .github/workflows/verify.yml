name: Diagnose Windows storage
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: windows-storage-probe-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-storage:
    name: storage-${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Trace a synthetic first write
        run: node scripts/probe-windows-storage.mjs
