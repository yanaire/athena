name: Verify Windows private storage helper
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: windows-helper-probe-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-storage:
    name: storage-${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the fixed Windows permission helper
        run: npm run windows:prepare
      - name: Verify actual owner, permissions and locked writes
        timeout-minutes: 5
        run: node --test --test-reporter=tap --test-concurrency=1 tests/private-storage.test.ts tests/local-credentials.test.ts
      - name: Compare isolated desktop operating system environments
        run: node scripts/probe-windows-desktop-env.mjs
      - name: Verify account transitions and desktop startup
        timeout-minutes: 10
        run: node --import ./scripts/trace-windows-credentials.mjs --test --test-reporter=tap --test-concurrency=1 tests/provider-startup.test.ts tests/chatgpt-account.test.ts tests/desktop-host.test.ts

