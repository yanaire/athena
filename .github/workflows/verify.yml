name: Diagnose Windows review failures

on:
  push:

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose-windows-${{ matrix.suite }}
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [files, profile-switch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked host dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record synthetic runner path behavior
        run: node --input-type=module -e "import {tmpdir} from 'node:os'; import {realpathSync} from 'node:fs'; console.log(JSON.stringify({platform:process.platform,tmp:tmpdir(),canonicalTmp:realpathSync(tmpdir())}));"
      - name: Reproduce file and publication failures with immediate TAP diagnostics
        if: matrix.suite == 'files'
        run: node --test --test-reporter=tap tests/analysis-files.test.ts tests/analysis-publication.test.ts
      - name: Reproduce the profile switch with immediate TAP diagnostics
        if: matrix.suite == 'profile-switch'
        run: node --test --test-reporter=tap --test-name-pattern="switching ChatGPT profiles" tests/chatgpt-account.test.ts
