name: Assemble Workflow candidate UI

on:
  push:
    branches:
      - integration/athena-workflow-ui-generation

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'yanaire/athena' && github.ref == 'refs/heads/integration/athena-workflow-ui-generation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bb9a81f2c16117f77345007c250d689dab90f6ba
          fetch-depth: 1
          persist-credentials: false
      - name: Generate and store the exact reviewed HTML bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          source = "bb9a81f2c16117f77345007c250d689dab90f6ba"
          expected = "a60f936eb4e6abced34b14e5eb99784657d6e358"
          relative = "athena-backend-handoff/athena-codex-ui/athena-preview.html"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != source:
              raise RuntimeError("Unexpected source revision")
          subprocess.run(["python3", "athena-backend-handoff/athena-codex-ui/build.py"], check=True)
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [relative]:
              raise RuntimeError("Generation changed an unexpected file")
          payload = pathlib.Path(relative).read_bytes()
          sha = hashlib.sha1(b"blob " + str(len(payload)).encode("ascii") + b"\0" + payload).hexdigest()
          if sha != expected or len(payload) != 1577072:
              raise RuntimeError("Generated HTML differs from locally verified bytes")
          request = urllib.request.Request(
              "https://api.github.com/repos/yanaire/athena/git/blobs",
              data=json.dumps({"encoding":"base64","content":base64.b64encode(payload).decode("ascii")}).encode("utf-8"),
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          if result.get("sha") != sha:
              raise RuntimeError("Stored blob differs from generated output")
          print("SAVED_BLOB", source, sha, len(payload), flush=True)
          PY
