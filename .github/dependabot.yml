version: 2

# Limits apply to version-update PRs per entry; security updates have a separate limit.
# Related packages are reviewed together, but grouping does not prove compatibility.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    groups:
      pi-sdk:
        applies-to: "version-updates"
        patterns:
          - "@earendil-works/pi-ai"
          - "@earendil-works/pi-coding-agent"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/athena-backend-handoff/athena-codex-ui/qa"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    groups:
      tauri-stack:
        applies-to: "version-updates"
        patterns:
          - "tauri*"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/sandbox"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 1
    groups:
      wasmtime-runtime:
        applies-to: "version-updates"
        patterns:
          - "wasmtime"
          - "wasmtime-wasi"
          - "wiggle"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
