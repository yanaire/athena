[package]
name = "athena-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
rustix = { version = "1.1", features = ["process"] }
wasmtime = { version = "=50.0.3", default-features = false, features = ["anyhow", "cranelift", "pulley", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.3", default-features = false, features = ["p1"] }
wiggle = { version = "=50.0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.15.0"

[lints.rust]
unsafe_code = "forbid"
