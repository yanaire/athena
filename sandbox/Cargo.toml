[package]
name = "athena-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
wasmtime = { version = "=51.0.0", default-features = false, features = ["anyhow", "cranelift", "pulley", "runtime", "std"] }
wasmtime-wasi = { version = "=51.0.0", default-features = false, features = ["p1"] }
wiggle = { version = "=51.0.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
memory-stats = "=1.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.15.0"

[lints.rust]
unsafe_code = "forbid"
